services:
  mysql:
    image: mysql:8.4
    container_name: hospital-mcp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: hospital_mcp
      MYSQL_USER: hospital_app
      MYSQL_PASSWORD: hospital_password
    ports:
      - "3306:3306"
    volumes:
      - hospital_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  hospital_mysql_data:

